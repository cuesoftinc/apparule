# One chart deploys every service (docs/system-design.md §10.2). The same
# images run in cloud; this chart is the self-host and cluster path.
#
# The chart does NOT deploy Postgres, Kafka, Redis or object storage. Point
# them at managed services (Aiven, GCS) or at in-cluster charts, through a
# Kubernetes Secret per service (envFrom). Secrets never go in plain values:
#   common:       DATABASE_URL (a NON-superuser role: superusers bypass RLS),
#                 UPLOAD_TICKET_PRIVATE_KEY, KAFKA_*, REDIS_PASSWORD,
#                 STORAGE_ACCESS_KEY/STORAGE_SECRET_KEY (s3 driver),
#                 PAYSTACK_SECRET_KEY, PAYSTACK_PUBLIC_KEY
#   uploads:      UPLOAD_TICKET_PUBLIC_KEYS, KAFKA_*, STORAGE_* keys
#   segmentation: KAFKA_*, STORAGE_* keys
#   commerce:     KAFKA_*, STORAGE_* keys, PAYSTACK_SECRET_KEY (empty runs
#                 notify-only), BREVO_API_KEY
replicaCount: 1

services:
  common:
    image: cuesoft/apparule-api-common:latest
    port: 8080
    healthPath: /health
    readyPath: /ready
    # Consumes Kafka and publishes the outbox, so keep one running. The
    # WAKE_* settings stay unset here: they only matter on Cloud Run, where
    # services scale to zero.
    replicaCount: 1
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: apparule
      STORAGE_PREFIX: apparule/selfhost
      STORAGE_ENDPOINT: seaweedfs:8333
      STORAGE_USE_SSL: "false"
      PORT: "8080"
      CORS_ORIGINS: https://apparule.example.com
      UPLOADS_URL: https://api.apparule.example.com/api/v1/uploads
      FIREBASE_PROJECT_ID: ""
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    envFrom:
      - secretRef: apparule-common

  uploads:
    image: cuesoft/apparule-api-uploads:latest
    port: 8082
    runAsUser: 1000 # node user in the image
    healthPath: /health
    readyPath: /ready
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: apparule
      STORAGE_PREFIX: apparule/selfhost
      STORAGE_ENDPOINT: seaweedfs:8333
      STORAGE_USE_SSL: "false"
      PORT: "8082"
      CORS_ORIGINS: https://apparule.example.com
    envFrom:
      - secretRef: apparule-uploads

  segmentation:
    image: cuesoft/apparule-api-segmentation:latest
    port: 8081
    healthPath: /health
    readyPath: /ready
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: apparule
      STORAGE_PREFIX: apparule/selfhost
      STORAGE_ENDPOINT: seaweedfs:8333
      STORAGE_USE_SSL: "false"
      PORT: "8081"
    envFrom:
      - secretRef: apparule-segmentation
    # MediaPipe needs memory to load both models (§10.1: 2 vCPU / 2 GiB).
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: "2"
        memory: 2Gi

  commerce:
    image: cuesoft/apparule-api-commerce:latest
    port: 8083
    healthPath: /health
    readyPath: /ready
    env:
      STORAGE_DRIVER: s3
      STORAGE_BUCKET: apparule
      STORAGE_PREFIX: apparule/selfhost
      STORAGE_ENDPOINT: seaweedfs:8333
      STORAGE_USE_SSL: "false"
      PORT: "8083"
    envFrom:
      - secretRef: apparule-commerce

  web:
    image: cuesoft/apparule-web:latest
    port: 3000
    runAsUser: 1000 # node user in the web image
    healthPath: /
    env:
      PORT: "3000"
      API_ORIGIN: http://common:8080
      UPLOADS_ORIGIN: http://uploads:8082

# Sweeps (§6.7), run as CronJobs from the common image.
jobs:
  image: cuesoft/apparule-api-common:latest
  envFrom:
    - secretRef: apparule-common
  env:
    STORAGE_DRIVER: s3
    STORAGE_BUCKET: apparule
    STORAGE_PREFIX: apparule/selfhost
    STORAGE_ENDPOINT: seaweedfs:8333
    STORAGE_USE_SSL: "false"
  schedules:
    captures: "* * * * *"
    orders: "7 * * * *"
    reconcile: "13 * * * *"
    retention: "17 3 * * *"

# Optional Ingress (templates/ingress.yaml): `host` serves one service (the
# web app); `apiHost` serves the API, sending /api/v1/uploads to uploads and
# every other path to common (§7.1). segmentation and commerce never get
# ingress.
ingress:
  enabled: false
  # className: traefik
  # host: apparule.example.com
  # service: web
  # apiHost: api.apparule.example.com
  # path: /
  # pathType: Prefix
  # annotations: {}
