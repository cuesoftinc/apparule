---
apiVersion: v3
kind: system
metadata:
  name: apparule
  displayName: apparule
  description: Apparule platform
  owner: cuesoft
  tags:
    - app:apparule
    - component:system
  contacts:
    - type: email
      contact: cuelabs@cuesoft.io
  additionalOwners:
    - name: platform
      type: SRE
  links:
    - name: Repository
      type: repo
      provider: github
      url: https://github.com/cuesoftinc/apparule
    - name: Website
      type: other
      url: https://apparule.cuesoft.io
spec:
  lifecycle: production
  tier: "1"
  components:
    - service:apparule-website
    - service:apparule-api-common
    - service:apparule-api-uploads
    - service:apparule-api-segmentation
    - service:apparule-api-commerce
    - datastore:apparule-postgres
    - datastore:apparule-redis
    - datastore:apparule-storage
    - datastore:cuelabs-kafka
---
apiVersion: v3
kind: service
metadata:
  name: apparule-api-common
  displayName: apparule-api-common
  description: Go product API, upload tickets, Paystack webhooks and sweeps
  owner: cuesoft
  tags:
    - app:apparule
    - component:api
  contacts:
    - type: email
      contact: cuelabs@cuesoft.io
  additionalOwners:
    - name: platform
      type: SRE
  links:
    - name: Repository
      type: repo
      provider: github
      url: https://github.com/cuesoftinc/apparule
spec:
  lifecycle: production
  tier: "1"
  type: web
  languages:
    - go
  dependsOn:
    - datastore:apparule-postgres
    - datastore:apparule-redis
    - datastore:apparule-storage
    - datastore:cuelabs-kafka
    - service:apparule-api-segmentation
    - service:apparule-api-commerce
---
